apiVersion: v1
kind: ServiceAccount
metadata:
  name: maintenance-operator
  namespace: aks-maintenance-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maintenance-operator-data
  namespace: aks-maintenance-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-operator
  namespace: aks-maintenance-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: maintenance-operator
  template:
    metadata:
      labels:
        app: maintenance-operator
    spec:
      serviceAccountName: maintenance-operator
      containers:
        - name: operator
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - python /app/maintenance_operator.py
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: DB_PATH
              value: /data/maintenance.db
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: operator-code
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: operator-code
          configMap:
            name: maintenance-operator-code
        - name: data
          persistentVolumeClaim:
            claimName: maintenance-operator-data
---
apiVersion: v1
kind: Service
metadata:
  name: maintenance-operator
  namespace: aks-maintenance-demo
spec:
  selector:
    app: maintenance-operator
  ports:
    - port: 8080
      targetPort: 8080
