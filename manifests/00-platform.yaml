apiVersion: v1
kind: Namespace
metadata:
  name: aks-maintenance-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maintenance-controller
  namespace: aks-maintenance-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maintenance-controller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maintenance-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: maintenance-controller
subjects:
  - kind: ServiceAccount
    name: maintenance-controller
    namespace: aks-maintenance-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: maintenance-demo-events
  namespace: aks-maintenance-demo
data:
  event.json: ""
