apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: maintenance-controller
  namespace: aks-maintenance-demo
spec:
  selector:
    matchLabels:
      app: maintenance-controller
  template:
    metadata:
      labels:
        app: maintenance-controller
    spec:
      serviceAccountName: maintenance-controller
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: controller
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - pip install --no-cache-dir requests kubernetes && python /app/controller.py
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LIVE_ACTION_MODE
              value: observe
            - name: POLL_SECONDS
              value: "2"
            - name: NOTIFICATION_WEBHOOK_URL
              value: ""
            - name: EVENT_STORE_URL
              value: "http://maintenance-operator.aks-maintenance-demo.svc.cluster.local:8080/events"
            - name: LEAD_SECONDS
              value: "1800"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: controller-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: controller-code
          configMap:
            name: maintenance-controller-code
